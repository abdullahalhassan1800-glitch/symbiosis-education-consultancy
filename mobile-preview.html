<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mobile preview — Symbiosis Education Consultancy</title>
<style>
  :root{--navy:#071a3d;--navy2:#0b2a5b;--blue:#136bc2;--gold:#f6d77c;--line:rgba(255,255,255,.14);--muted:rgba(255,255,255,.6)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#fff;background:radial-gradient(1200px 600px at 50% -10%,#123a78 0%,#071a3d 55%,#040f27 100%);display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:.7rem 1rem;border-bottom:1px solid var(--line);background:rgba(4,15,39,.6);backdrop-filter:blur(6px);z-index:5}
  .brand{display:flex;align-items:center;gap:.6rem;font-weight:700;letter-spacing:.3px}
  .brand b{color:var(--gold)}
  .brand small{color:var(--muted);font-weight:500}
  .devices{display:flex;gap:.4rem;flex-wrap:wrap;margin-left:auto}
  .devices button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;padding:.42rem .7rem;border-radius:999px;font:inherit;font-size:.8rem;cursor:pointer;transition:.18s}
  .devices button:hover{background:rgba(255,255,255,.14)}
  .devices button.on{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:700}
  .tools{display:flex;gap:.4rem}
  .tools button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;width:36px;height:36px;border-radius:10px;font:inherit;cursor:pointer}
  .tools button:hover{background:rgba(255,255,255,.14)}
  .stage{flex:1;display:grid;place-items:center;gap:0;overflow:auto;padding:1.4rem}
  .phone{position:relative;background:#0a0f1d;border:12px solid #1a2336;border-radius:44px;box-shadow:0 40px 90px -30px rgba(0,0,0,.8),inset 0 0 0 2px rgba(255,255,255,.05);transition:width .25s,height .25s}
  .phone::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:34%;height:22px;background:#05080f;border-radius:0 0 16px 16px;z-index:2}
  .phone::after{content:"";position:absolute;bottom:10px;left:50%;transform:translateX(-50%);width:110px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);z-index:2}
  iframe{width:100%;height:100%;border:0;border-radius:32px;background:#fff;display:block}
  .meta{text-align:center;color:var(--muted);font-size:.82rem;margin-top:.4rem}
  .meta b{color:#fff}
  .hint{border:1px solid var(--line);border-radius:12px;padding:.5rem .8rem;font-size:.78rem;color:var(--muted);max-width:640px;margin:0 auto}
  .hint code{color:var(--gold)}
  @media (max-width:720px){.devices{margin-left:0}.brand small{display:none}}
</style>
</head>
<body>
  <header>
    <div class="brand">📱 <b>SYMBIOSIS</b> <small>· mobile preview</small></div>
    <div class="devices" id="devices"></div>
    <div class="tools">
      <button id="rotate" title="Rotate" aria-label="Rotate">⟳</button>
      <button id="reload" title="Reload" aria-label="Reload">↻</button>
      <button id="open" title="Open in new tab" aria-label="Open in new tab">↗</button>
    </div>
  </header>
  <div class="stage">
    <div>
      <div class="phone" id="phone"><iframe id="view" src="index.html" title="Site preview"></iframe></div>
      <div class="meta">Viewport <b id="size">375 × 667</b> · <span id="label">iPhone SE</span></div>
    </div>
  </div>
  <div class="hint" style="padding:0 1rem 1rem">Real device test ke liye <code>http://localhost:4174/</code> apne phone me kholein (same Wi-Fi) — ya Chrome DevTools → Toggle device toolbar (Ctrl+Shift+M) use karein.</div>

<script>
  var DEVICES = [
    { label: 'iPhone SE', w: 375, h: 667 },
    { label: 'iPhone 13', w: 390, h: 844 },
    { label: 'Pixel 5', w: 393, h: 851 },
    { label: 'Galaxy S20', w: 360, h: 800 },
    { label: 'iPhone 14 Pro Max', w: 430, h: 932 }
  ];
  var phone = document.getElementById('phone');
  var view = document.getElementById('view');
  var sizeEl = document.getElementById('size');
  var labelEl = document.getElementById('label');
  var devicesEl = document.getElementById('devices');
  var current = DEVICES[1];
  var rotated = false;

  function apply() {
    var w = rotated ? current.h : current.w;
    var h = rotated ? current.w : current.h;
    phone.style.width = w + 'px';
    phone.style.height = h + 'px';
    sizeEl.textContent = w + ' \u00d7 ' + h;
    labelEl.textContent = current.label + (rotated ? ' · landscape' : '');
    [...devicesEl.children].forEach(function (b) { b.classList.toggle('on', b.dataset.label === current.label); });
  }
  DEVICES.forEach(function (d) {
    var b = document.createElement('button');
    b.textContent = d.label;
    b.dataset.label = d.label;
    b.onclick = function () { current = d; rotated = false; apply(); };
    devicesEl.appendChild(b);
  });
  document.getElementById('rotate').onclick = function () { rotated = !rotated; apply(); };
  document.getElementById('reload').onclick = function () { view.src = view.src; };
  document.getElementById('open').onclick = function () { window.open('index.html', '_blank', 'noopener'); };
  apply();
</script>
</body>
</html>
